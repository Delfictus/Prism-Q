[workspace]
resolver = "2"
members = [
    "crates/prism-forge",
    "crates/prism-nhs",
    "crates/prism-gpu",
    "crates/prismcode",
    "crates/prism-tokenizer",
    "crates/prismos-ui",
    "xtask",
]

default-members = [
    "crates/prism-forge",
    "crates/prism-nhs",
    "crates/prism-gpu",
    "crates/prismcode",
]

exclude = [
    ".archive",
    ".archive/crates/*",
]

[workspace.package]
version = "0.3.0"
edition = "2021"
authors = ["PRISM-AI Research Team"]
license = "LicenseRef-Proprietary"
repository = "https://github.com/Delfictus/Prism-Q"
publish = false

[workspace.metadata.deny]
banned_crates = ["duckdb", "rusqlite", "libsqlite3-sys", "sqlx-sqlite"]

[workspace.dependencies]
# Core error handling and async
anyhow = "1.0"
thiserror = "1.0"
tokio = { version = "1", features = ["full"] }
async-trait = "0.1"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
bincode = "1.3"
toml = "0.8"

# GPU acceleration - 0.18.2 with stream support
cudarc = { version = "0.18.2", features = ["std", "cuda-12050", "driver"] }

# ONNX Runtime for GNN inference
ort = { version = "2.0.0-rc.10", features = ["cuda"] }

# Math and scientific computing
ndarray = "0.15"
nalgebra = "0.32"
rand = "0.8"
rand_distr = "0.4"
rand_chacha = "0.3"
statrs = "0.16"
num-complex = "0.4"
rustfft = "6.2"
ordered-float = "4.2"

# Graph algorithms
petgraph = "0.6"

# Parallelism
rayon = "1.7"
crossbeam-utils = "0.8"

# Telemetry and metrics
prometheus = "0.14"
axum = "0.7"
hyper = "1.0"
log = "0.4"
env_logger = "0.10"

# CLI
clap = { version = "4.5", features = ["derive"] }
colored = "2.1"
indicatif = "0.17"

# Utilities
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.6", features = ["v4", "serde"] }
dashmap = "6.0"
parking_lot = "0.12"
lazy_static = "1.4"

# Cryptography (for PTX signing)
sha2 = "0.10"
hex = "0.4"

# Inter-crate dependencies kept as support dependencies outside the production workspace.
prism-core = { path = ".archive/crates/prism-core" }
prism-gpu = { path = "crates/prism-gpu" }
prism-io = { path = ".archive/crates/prism-io" }
prism-physics = { path = ".archive/crates/prism-physics" }
prism-nhs = { path = "crates/prism-nhs" }

[profile.release]
opt-level = 3
debug = false
lto = "thin"
codegen-units = 1

[profile.bench]
inherits = "release"
debug = true

# Patch cudarc locally to add capture-mode-aware bind_to_thread()
# See vendor/cudarc/src/driver/safe/core.rs — adds set_capture_mode_active()
# that makes bind_to_thread() a no-op during stream capture. This is required
# because cuCtxGetCurrent/cuCtxSetCurrent are illegal during cuStreamBeginCapture.
[patch.crates-io]
cudarc = { path = "vendor/cudarc" }
