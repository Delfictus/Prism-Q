[package]
name = "prism-cuda-ext"
version = "0.1.0"
edition = "2021"
description = "PRISM-TWIN advanced CUDA extensions: device-side spike compaction (CUB), conditional CUDA graphs, device-updated parameters"
license = "MIT"

[features]
default = ["cuda"]
cuda = []

[dependencies]
anyhow = "1.0"
log = "0.4"

# GPU acceleration — same cudarc version as prism-nhs
cudarc = { version = "0.18.2", features = ["std", "cuda-12050", "driver"] }

[build-dependencies]
cc = "1.0"
