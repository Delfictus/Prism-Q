[package]
name = "prism-nhs"
version = "0.1.0"
edition = "2021"
authors = ["PRISM-4D Engineering Team"]
description = "Neuromorphic Holographic Stream (NHS) for real-time cryptic site detection with UV bias perturbation"
license.workspace = true
readme = "README.md"
publish.workspace = true
repository.workspace = true

[features]
# `diagnostic` is in `default` so the bin's `--m1-typed-producer`
# wire-in continues to compile against the migrated
# `diagnostic::m1_differential` module without scattering
# `#[cfg]` gates throughout `bin/nhs_rt_full.rs`. Production lockdown
# excludes it explicitly:
#   cargo build --release -p prism-nhs --bin nhs_rt_full \
#     --no-default-features --features gpu,ensemble,v2_ignition
default = ["gpu", "diagnostic"]
cudarc = ["dep:cudarc"]
gpu = [
    "cudarc",
    "dep:prism-cuda-ext",
    "dep:prism-gpu",
    "prism-gpu/cuda",
    "dep:prism-io",
    "dep:prism-learning",
]
# Source-validation lane for the exact Ghost/lattice/Path-B/lambda reference
# surfaces. This feature deliberately has no dependency edges: in particular it
# must not activate cudarc or any internal crate whose default graph activates
# CUDA. Production remains on the default `gpu` feature.
cpu-analysis = []
# OptiX is not part of the SM120 production closure. Keep the historical
# implementation available only when the SDK-backed feature is requested
# explicitly; the `gpu` feature alone uses the CUDA clustering backend.
optix = ["gpu", "dep:prism-optix", "dep:optix-sys"]
# The canonical phase-manifold ranker is native and does not require ONNX.
# Keep the legacy xgb-v3 replay lane explicit so the offline MD executable
# does not acquire an unfulfilled dynamic-runtime dependency.
onnx = ["dep:ort"]
# Diagnostic / informational modules. Per Blackwell Convergence
# mandate §2 the M1.2.5b typed-producer differential
# (`src/diagnostic/m1_differential.rs`) is no longer a closure gate
# — it survives only as an opt-out feature. The cfg gate makes the
# diagnostic surface excludable from production builds without
# touching source.
diagnostic = []
ensemble = []
# V2 ignition authority: OPERATOR_V2_IGNITION_EXECUTE_20260725.
# The captured pipeline is CUDA-only, so this feature implies `gpu`.
v2_ignition = ["gpu"]
# Force-Gear Orchestration Supervisor Shim — host-side gear_override
# write at chunk boundaries crossing steps 800/1000. Violates Self-
# Clocking Control Plane Invariant #1 (device-derived control only).
# Default OFF. Enable ONLY for the Hardware-Interlock proof. When the
# feature fires it MUST emit a ControlPlaneRecord::GearOverride record
# with host_mutation=true (see crates/prism-nhs/src/control_trace.rs).
# See:
#   docs/PRISM4D_PARENT_CONTROL_SUPERGRAPH_IMPLEMENTATION_DIRECTIVE.md
#     §10, §15.2, Gate G2
#   docs/SELF_CLOCKING_CONTROL_PLANE_PLAN.md §4.1
#   .prism_orchestration/GEAR_OVERRIDE_MITIGATION_PLAN.md
force_gear_override_supervisor_shim = []

[dependencies]
# PRISM-Therm: SDST thermodynamic analysis pipeline
sdst = { path = "../../.archive/crates/sdst" }

# Core
anyhow = "1.0"
thiserror = "1.0"
log = "0.4"
serde = { version = "1.0", features = ["derive"] }
# Force-field contracts hash exact IEEE-754 bytes after JSON decode. The
# default fast parser can differ by one ULP for valid long decimals.
serde_json = { version = "1.0", features = ["float_roundtrip"] }
zstd = "0.13"
serde_yaml = "0.9"
sha2 = { workspace = true }
rayon = { workspace = true }
uuid = { workspace = true }
# DSTW Option A dispatcher: blake3 hashes for the round-link chain on
# PRISMExecutionRequest / PRISMExecutionResponse payloads.
blake3 = "1.5"
ryu = "1.0"
# ZSTR O_DIRECT consumer: pwrite(2), fdatasync(2), O_DIRECT flag
libc = "0.2"
# Wave 0 / #69 — io_uring SQE zero-copy NVMe sink for the ZSTR Reaper.
# Excommunicates the Linux page cache from the exfiltration path:
# pinned ring slot → IORING_OP_WRITE SQE → NVMe queue, no VFS
# buffer copy. 0.5.13 matches the workspace lock (transitive via
# tokio-uring) so we share the resolved version graph.
io-uring = "0.5.13"

# Async streaming
tokio = { version = "1.0", features = ["sync", "macros", "rt-multi-thread"] }

# GPU acceleration - CUDA 12.x for NHS compute kernels
# `nvrtc` feature enables runtime CUDA source -> PTX compilation, used by
# gpu_cluster_backend for post-MD clustering on SM120 where OptiX is unavailable.
cudarc = { version = "0.18.2", features = ["std", "cuda-12050", "driver", "nvrtc"], optional = true }

# FP16 for TWIN Tensor Core CCF (WMMA input format)
half = "2"

# PRISM-TWIN advanced CUDA: device-side compaction, conditional graphs, exhaust pipeline
prism-cuda-ext = { path = "../../.archive/crates/prism-cuda-ext", optional = true }

# File pattern matching for trajectory discovery
glob = "0.3"

# Random number generation for UV burst patterns
rand = "0.8"
rand_distr = "0.4"

# Statistical analysis for CCNS power-law fitting
statrs = { workspace = true }

# ONNX Runtime via ort crate — loads the XGBoost v3 binding-site ranker.
# The ISO is offline and relocatable, so the native API-23 runtime is loaded
# from the packaged path at execution time rather than downloaded at build time.
ort = { version = "2.0.0-rc.10", default-features = false, features = ["std", "ndarray", "load-dynamic"], optional = true }
ndarray = "0.16"

# Apache Arrow IPC streaming for per-spike training data export (Stage 1B-1).
# Pure Rust implementation; no system dependencies. Used by spike_arrow_writer
# to produce columnar per-target Arrow IPC files with full per-spike tagging
# (28 columns including phase_bits, nearby_residues, group_id, chunk_idx,
# voxel_idx, wd_change, plus background spike stratification).
arrow = "58"
arrow-ipc = "58"
arrow-array = "58"
arrow-schema = "58"
parquet = { version = "58", default-features = false, features = ["arrow", "zstd"] }

# CLI
clap = { version = "4.5", features = ["derive"] }
env_logger = "0.10"
chrono = { version = "0.4", features = ["serde"] }

# Internal crates
prism-io = { path = "../../.archive/crates/prism-io", optional = true }
prism-learning = { path = "../../.archive/crates/prism-learning", optional = true }
prism-gpu = { path = "../prism-gpu", optional = true }
prismcode = { path = "../prismcode" }
# Codec-registered token vocabulary. The gearbox-facing TSH arm emits
# `ThermodynamicActionOpcode` (family slot 74) directly rather than inventing a
# parallel action enum, so the registered opcode has a real producer instead of
# a definition with zero writers. Lib-only edge; prism-tokenizer depends on
# prismcode, which prism-nhs already depends on, so the graph stays acyclic.
prism-tokenizer = { path = "../prism-tokenizer" }
prism-optix = { path = "../../.archive/crates/prism-optix", optional = true }
optix-sys = { path = "../../.archive/crates/optix-sys", optional = true }

