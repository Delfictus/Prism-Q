# Review-bundle CI for Prism-Q.
#
# There is no GPU here. This workflow checks that REVIEW_BUNDLE.md is current, that every source
# anchor resolves, that the independent CPU reference checks give no unexpected failure, and runs
# the CPU-only tests that are declared portable. GPU gates (native runs, determinism, sanitizer,
# profiling, qualification) are recorded as receipts outside this repository and cited by hash;
# CI never claims them.
name: review-bundle

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: review-bundle-${{ github.ref }}
  cancel-in-progress: true

jobs:
  review-bundle:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Install pinned reference-check dependencies
        run: python -m pip install --disable-pip-version-check --no-input -r scripts/physics_refs/requirements.txt

      - name: Bundle staleness and anchor check (--check)
        run: python scripts/build_review_bundle.py --check

      - name: Independent reference checks (--verify)
        run: python scripts/build_review_bundle.py --verify --json verify.json

      - name: CPU-only tests (declared portable)
        shell: bash
        run: |
          set -euo pipefail
          list=ci/cpu_tests.txt
          if [[ ! -s "$list" ]] || ! grep -qv '^\s*\(#\|$\)' "$list"; then
            echo "NOT_BUILT: no portable CPU-only tests are declared in $list yet."
            echo "Most existing tests read host evidence paths or need a GPU; they run under receipts, not CI."
            exit 0
          fi
          rc=0
          while IFS= read -r t; do
            [[ -z "$t" || "$t" == \#* ]] && continue
            echo "::group::$t"
            python -m unittest -v "$t" || rc=1
            echo "::endgroup::"
          done < "$list"
          exit $rc

      - name: GPU gates
        run: echo "GPU gates are not run in CI (no GPU). Their receipts are cited by hash in manifests/ and REVIEW_BUNDLE.md."

      - name: Upload verify results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: review-bundle-verify
          path: verify.json
          if-no-files-found: ignore
