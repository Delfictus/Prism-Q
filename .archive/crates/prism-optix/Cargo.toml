[package]
name = "prism-optix"
version = "0.1.0"
edition = "2021"
authors = ["PRISM-AI Research Team"]
license = "MIT"
repository = "https://github.com/prism-ai/prism"
description = "Safe Rust wrapper for NVIDIA OptiX 9.1.0 ray tracing API"

# Safe, ergonomic wrapper over optix-sys
# Provides RAII resource management, error handling, and safe abstractions

[dependencies]
optix-sys = { path = "../optix-sys" }
cudarc = { version = "0.18.2", features = ["std", "cuda-12050", "driver"] }
anyhow = "1.0"
thiserror = "2.0"
log = "0.4"
libloading = "0.8"

[dev-dependencies]
env_logger = "0.11"

[lib]
name = "prism_optix"
path = "src/lib.rs"
