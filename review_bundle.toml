\(\tau\,\dot V_u = -(V_u - V_{rest}) + \sum_{v\sim u} w_{uv}(V_v - V_u) + I_u\); spike when \(V_u \ge \theta\), reset, refractory \(t_{ref}\).
Edge flux: \(f_{uv} = w_{uv}(V_v - V_u)\), antisymmetric: \(f_{vu} = -f_{uv}\).
'''
