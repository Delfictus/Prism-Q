# Prism-Q review bundle specification.
#
# scripts/build_review_bundle.py reads this file, pulls verbatim source excerpts
# from the engine root, hashes every included file and renders REVIEW_BUNDLE.md.
# REVIEW_BUNDLE.md is generated: never edit it by hand, edit this file or the source.
#
# Paths are relative to the engine root (the repository root of Prism-Q).
#
# Excerpt selectors (exactly one per excerpt):
#   symbol = '<python regex>'  first matching line; the excerpt runs to the end of the
#                              brace-balanced body (C/C++/CUDA/Rust), capped at max_lines.
#                              occurrence = N picks the N-th match (1-based, default 1).
#   anchor = '<python regex>'  first matching line, with `before` / `after` context lines.
#   lines  = [start, end]      fixed 1-based inclusive range (use only for stable files).
#
# Anchor outcomes:
#   file missing             -> the excerpt renders NOT_BUILT (never skipped).
#   file present, no match   -> ANCHOR_BROKEN; `--check` fails until this file is updated.
#
# Layer status vocabulary: QUALIFIED | EXECUTED_UNQUALIFIED | NOT_BUILT.
# Defect status vocabulary: OPEN | FIX_IN_REVIEW | FIXED | WONTFIX_DOCUMENTED.
# A section may list `planned` components that do not exist yet; they render as NOT_BUILT rows.

[bundle]
title = "Prism-Q engine review bundle"
schema_version = 1
max_bytes = 2_200_000
default_max_lines = 140
claim_scope = """
Computational evidence only. Nothing in this repository or bundle is wet-lab, clinical,
regulatory, synthesis, safety or ADMET validation. The BIPRISM electronic layer is a
phenomenological quantum analogue with uncalibrated parameters (label: analogue_uncalibrated)
until the tight-binding grounding package passes its gates."""
hazards = [
  "PTX resolution: generated PTX is never committed. The nhs_rt_full path resolves PTX through prism_gpu::ptx_authority (env dir, beside the executable, then this build's OUT_DIR/ptx) and records kernel_set_sha256 (e6d7c4f). Still open: the nhs-analyze-* binaries and 6 prism-gpu modules resolve PTX outside the authority, and the baked OUT_DIR fallback can bind a mutable build tree for an installed binary that has no env and no ptx/ beside it (review findings S2-F1..F10).",
  "The v10/v9 adjudicator include now resolves to the real crates/prism-nhs/src/cuda/adjudicator.cuh, and a missing header is an #error (67d6730; PTX byte-identical). Builds before 67d6730 compiled an opaque 256-byte stand-in struct. Open: prism-gpu build.rs does not list that header as rerun-if-changed (S1-F1).",
  "Workspace .cargo/config.toml replaces crates-io with vendor/crates-io, which is not published; a public build needs `cargo vendor` or removal of the source replacement.",
  "The SDST library is a prebuilt binary kept outside this repository; the build reads it through SDST_LIB_DIR pinned by PRISM_SDST_LIB_SHA256 and fails closed when missing or mismatched.",
]

[[section]]
id = "S01"
title = "Topology and preparation (HMR, residue identity)"
stage = "input"
status = "EXECUTED_UNQUALIFIED"
summary = """
Reads a prepared AMBER-parameterised topology (ff14SB/ff19SB style prmtop/JSON), builds per-atom
masses, charges, LJ parameters, bonded terms, exclusions and residue identity. Hydrogen mass
repartitioning (HMR) moves mass from heavy atoms to bonded hydrogens. Residue identity is carried
as residue index plus name and chain; insertion codes and PDB numbering are not carried end to end."""
equations = '''
HMR: for each H bonded to heavy atom X, \(m_H' = f\,m_H\), \(m_X' = m_X - (f-1)\,m_H\), total mass conserved: \(\sum_i m_i' = \sum_i m_i\).
'''
units = [
  ["mass", "amu (g/mol)"],
  ["charge", "e"],
  ["length", "Angstrom"],
  ["LJ epsilon", "kcal/mol"],
  ["LJ sigma", "Angstrom"],
]
invariants = [
  "Total mass is unchanged by HMR (to FP64 round-off).",
  "No hydrogen mass exceeds its declared target; no heavy atom mass becomes non-positive.",
  "Each atom maps to exactly one (chain, residue index, residue name); this map is the spatial anchor for every downstream datum.",
]
gate = "Topology round trip against the prep tool output: per-atom mass/charge/type identity, residue identity (chain, PDB number, insertion code) preserved, HMR total-mass check."
questions = [
  "Derive the heavy-atom mass after apply_hmr for a CH3 group with factor f and show the total-mass invariant holds in the excerpt (cite path:line).",
  "Where is the PDB residue number and insertion code carried? If it is not carried, list every downstream consumer that converts residue index to residue number and show the conversion (path:line).",
  "Does the historical-May HMR path (apply_hmr_historical_may_execution) apply HMR a second time to an already repartitioned topology? Show the guard.",
  "gb_radii is emitted by prep: find any reader in the engine. If there is none, state it as a finding.",
]
  [[section.excerpt]]
  path = "crates/prism-nhs/src/input.rs"
  symbol = 'pub fn apply_hmr\('
  [[section.excerpt]]
  path = "crates/prism-nhs/src/input.rs"
  symbol = 'fn apply_hmr_with_historical_repeat'
  [[section.excerpt]]
  path = "crates/prism-nhs/src/input.rs"
  anchor = 'pub residue_ids: Vec<usize>'
  before = 6
  after = 14
  [[section.defect]]
  id = "D-RESID-OFFSET"
  title = "Residue index converted with lr.resid - 1 in site lining / phase-manifold features"
  where = "crates/prism-nhs/src/bin/nhs_rt_full.rs (lr.resid - 1, four sites)"
  status = "OPEN"
  fix_package = "P3"
