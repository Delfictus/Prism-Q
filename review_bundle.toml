[[section]]
id = "S02"
title = "Bonded and nonbonded forces"
stage = "forces"
status = "EXECUTED_UNQUALIFIED"
summary = """
Production nonbonded is plain Coulomb with epsilon_r = 1 (vacuum) plus 12-6 LJ, cut at 10 Angstrom
with a potential shift on the ordinary (non-exception) pairs. This is vacuum, not implicit solvent.
1-4 pairs use ff14SB fudge factors or exact prmtop exceptions. A second kernel,
compute_nonbonded_neighborlist, carries a distance-dependent dielectric (epsilon = 4r); which kernel
the production route launches must be established from the host launch sites (reviewer question 5)."""
equations = '''
\(F_{ij} = \left[24\,\varepsilon_{ij}\,r^{-2}\left(2(\sigma/r)^{12}-(\sigma/r)^{6}\right) + k_C\,q_iq_j\,r^{-3}\right]\mathbf r_{ij}\), \(k_C = 332.0636\) kcal mol\(^{-1}\) Å e\(^{-2}\)

Shifted potential for \(r<r_c\): \(V(r) = V_{LJ}(r)+V_C(r) - [V_{LJ}(r_c)+V_C(r_c)]\); force is not shifted (discontinuous force derivative at \(r_c\)).

Lorentz-Berthelot: \(\sigma_{ij}=\tfrac12(\sigma_i+\sigma_j)\), \(\varepsilon_{ij}=\sqrt{\varepsilon_i\varepsilon_j}\).
'''
units = [
  ["r, sigma, cutoff", "Angstrom"],
  ["epsilon, V", "kcal/mol"],
  ["q", "e"],
  ["k_C (COULOMB_CONSTANT)", "kcal mol^-1 Angstrom e^-2"],
  ["F", "kcal mol^-1 Angstrom^-1"],
]
invariants = [
  "Newton's third law per pair: fi -= f, fj += f.",
  "The potential offset applies to ordinary pairs only; exact exception pairs are never shifted and stay active beyond the cutoff.",
  "Net force on an isolated system with no external field is zero to round-off.",
]
gate = "Per-term energy and force agreement against an independent reference (OpenMM 8.6.1 with identical cutoff/shift settings) on frozen snapshots; finite-difference force check of the composed potential."
questions = [
  "Show the units of each factor in elec_force and confirm the result is kcal mol^-1 Angstrom^-2 before multiplication by r_ij (path:line).",
  "ordinary_cutoff_potential_offset_v1 shifts the potential but not the force. Quantify the energy-conservation consequence at r_c = 10 Angstrom for a +1/-1 pair.",
  "Which value of the Coulomb constant does the engine use, and how does it compare with AMBER (332.0522173), CHARMM (332.0716) and the CODATA 2022 value? (See the unit_conversions check.)",
  "Is there any dielectric, reaction-field or GB term on the production path? Cite the line where it would be applied or state that it is absent.",
  "compute_nonbonded_neighborlist uses epsilon = 4r while compute_nonbonded_force uses epsilon = 1. Find every host launch of each kernel (fused_engine.rs) and state which one the production route executes.",
]
